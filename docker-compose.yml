services:
  # =======================================================
  # 🐹 Go Backend Core (Clean Architecture + Gemini Agent)
  # =======================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: systemcrafter-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://localhost}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-25}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-50}
      - MAX_BODY_BYTES=${MAX_BODY_BYTES:-15728640}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-60}
      - CACHE_CLEANUP_INTERVAL_MINUTES=${CACHE_CLEANUP_INTERVAL_MINUTES:-10}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - workspace-data:/app/storage
    networks:
      - systemcrafter-net

  # =======================================================
  # 🌐 Next.js Frontend (React 19 + TypeScript + TailwindCSS)
  # =======================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: systemcrafter-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://backend:8080}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - systemcrafter-net

  # =======================================================
  # 🔀 Nginx Reverse Proxy Gateway (Unified entrypoint on Port 80)
  # =======================================================
  gateway:
    image: nginx:alpine
    container_name: systemcrafter-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - systemcrafter-net

  # =======================================================
  # ☁️ Cloudflare Quick Tunnel (Free Public HTTPS URL)
  # =======================================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: systemcrafter-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:80
    depends_on:
      gateway:
        condition: service_started
    networks:
      - systemcrafter-net

networks:
  systemcrafter-net:
    driver: bridge

volumes:
  workspace-data:
